name: Build Review Link APK

on:
  push:
    branches:
      - temp-review-link-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GoogleReviewLink.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoogleReviewLink-APK
          path: out/GoogleReviewLink.apk
